<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Listas </h1>
    <h1>Listas desordenadas</h1>
    <!-- Lista de elementos sin orden especifico (unordered list )-->
    <ul>
        <li>Luke Skywalker</li>
        <li>Leia Organa</li>
        <li>Han Solo</li>
        <li>Darth Vader</li>

    </ul>
    <h1>Listas ordenadas</h1>
    <!-- Lista de elementos con orden especifico (ordered list )-->
    <ol>
        <li>Luke Skywalker</li>
        <li>Leia Organa</li>
        <li>Han Solo</li>
        <li>Darth Vader</li>
    </ol>
</body>
</html>
