<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores</title>
    <style>
        body {
            background-color: #0b1020;
        }
        h1{
            color: red
        }
        h2 {
            color: #Ff0000;
        }
        h3 {
            color: rgb(red green blue / alpha)
        }
        h4{
            color: rgba(255,0,00,0.5)
        }
        h5{
            color:hsl(0,100%,50%)
        }
    </style>
</head>
<body>
    <h1>Mneras de establecer colores</h1>
    <h1>PPor el nombre del color</h1>
    <h2>Por hexadecimal</h2>
    <h3>RGB</h3>
    <h4>RGBA</h4>
    <h5>HSL</h5>

    
</body>
</html>
